<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chatku</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<section id="auth" class="screen">
  <div class="card">
    <h1>Chatku</h1>
    <p class="sub">Masuk untuk mulai ngobrol.</p>
    <input id="name" placeholder="Nama (khusus daftar)">
    <input id="email" type="email" placeholder="Email">
    <input id="pass" type="password" placeholder="Kata sandi (min. 6 karakter)">
    <p id="err" class="err"></p>
    <button id="btnLogin">Masuk</button>
    <button id="btnReg" class="ghost">Daftar akun baru</button>
  </div>
</section>

<section id="setname" class="screen hidden">
  <div class="card">
    <h1>Pilih username</h1>
    <p class="sub">Teman bisa mencarimu lewat username ini. Huruf kecil, angka, dan _ (3-20 karakter).</p>
    <input id="uname" placeholder="contoh: rama_01" autocapitalize="none">
    <p id="unameErr" class="err"></p>
    <button id="btnUname">Simpan username</button>
  </div>
</section>

<section id="app" class="screen hidden">
  <aside id="list">
    <header>
      <button id="btnMe" class="who"><span id="meAv"></span><strong id="me"></strong></button>
      <button id="btnOut" class="ghost sm">Keluar</button>
    </header>
    <div class="find">
      <input id="findEmail" placeholder="Username teman" autocapitalize="none">
      <button id="btnFind" class="sm">Mulai chat</button>
    </div>
    <p id="findErr" class="err"></p>
    <ul id="chats"></ul>
  </aside>
  <main id="room" class="hidden">
    <header>
      <button id="btnBack" class="ghost sm">‹</button>
      <button id="peerBox" class="who"><span id="peerAv"></span><span class="col"><strong id="peer"></strong><small id="status"></small></span></button>
    </header>
    <div id="msgs"></div>
    <div id="replybar" class="hidden"><span id="replytxt"></span><button id="btnNoReply" class="ghost sm">✕</button></div>
    <div class="send">
      <input id="text" placeholder="Tulis pesan">
      <button id="btnSend">Kirim</button>
    </div>
  </main>
</section>

<div id="menu" class="overlay hidden"><div class="sheet">
  <button id="mReply" class="ghost">Balas</button>
  <button id="mMe" class="ghost">Hapus untuk saya</button>
  <button id="mAll" class="ghost">Hapus untuk semua</button>
  <button id="mCancel">Batal</button>
</div></div>

<div id="profile" class="overlay hidden"><div class="sheet">
  <div id="pfAv" class="center"></div>
  <input id="pfFile" type="file" accept="image/*">
  <input id="pfName" placeholder="Nama">
  <input id="pfBio" placeholder="Bio singkat" maxlength="120">
  <small id="pfUser"></small>
  <p id="pfErr" class="err"></p>
  <button id="pfSave">Simpan</button>
  <button id="pfClose" class="ghost">Tutup</button>
</div></div>
<script type="module" src="app.js"></script>
</body>
</html>
